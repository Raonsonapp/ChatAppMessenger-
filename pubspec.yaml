name: chatapp
description: "ChatApp — барномаи паёмрасон бо Flutter, Firebase ва AI Assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter

  # Иконкаҳои услуби iOS (стандартан бо flutter create меояд)
  cupertino_icons: ^1.0.8

  # Феҳристи иконкаҳои услуби react-icons (Lucide — идомаи фаъоли Feather) — тарроҳии зебо ва ягона
  flutter_lucide: ^1.41.0

  # Firebase — асоси backend (Auth + Firestore + Storage)
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.5.0

  # Интихоби расм аз галерея/камера (барои паёмҳои расмӣ)
  image_picker: ^1.2.3

  # Контактҳои воқеии телефон (барои интихоби корбар ҳангоми чати нав)
  flutter_contacts: ^1.1.9+2

  # Занги воқеии садоӣ/видеоӣ (Agora RTC)
  agora_rtc_engine: ^6.6.4
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
