name: Create Flutter Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-platforms:
    runs-on: ubuntu-latest

    steps:
      - name: Гирифтани репозиторий
        uses: actions/checkout@v7

      - name: Насби Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter doctor
        run: flutter doctor -v

      - name: Сохтани ҳамаи платформаҳо
        run: flutter create --platforms=android,ios,web,linux,macos,windows --project-name chatapp .

      - name: Танзими minSdk=23 барои Android (лозим барои Firebase)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Санҷиши мавҷудияти платформаҳо
        run: |
          test -d android && echo "ANDROID OK" || echo "ANDROID MISSING"
          test -d ios && echo "IOS OK" || echo "IOS MISSING"
          test -d web && echo "WEB OK" || echo "WEB MISSING"
          test -d linux && echo "LINUX OK" || echo "LINUX MISSING"
          test -d macos && echo "MACOS OK" || echo "MACOS MISSING"
          test -d windows && echo "WINDOWS OK" || echo "WINDOWS MISSING"

      - name: Сабт ва фиристодан (танҳо платформаҳо, бе lib/ ва pubspec.yaml)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android ios web linux macos windows
          if git diff --cached --quiet; then
            echo "Ҳеҷ тағйирот нест — платформаҳо аллакай мавҷуданд."
          else
            git commit -m "chore: generate all Flutter platform folders (no app code touched)"
            git push
          fi
