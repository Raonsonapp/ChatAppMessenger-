name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Гирифтани репозиторий
        uses: actions/checkout@v7

      - name: Насби Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Насби Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Санҷиши Flutter
        run: flutter --version

      - name: Санҷиши платформаи Android
        run: |
          if [ ! -d "android" ]; then
            echo "Папкаи android ёфт нашуд."
            flutter create --platforms=android .
          fi

      - name: Танзими minSdk
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Насби вобастагиҳо
        run: flutter pub get

      - name: Санҷиши коди Dart
        run: flutter analyze

      - name: Сохтани APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Боркунии APK
        uses: actions/upload-artifact@v7
        with:
          name: chatapp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
