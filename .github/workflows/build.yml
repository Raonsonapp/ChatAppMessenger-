name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Ҳангоми якчанд push пай дар пай танҳо охирин сохта мешавад: сохтани нусхаи
# кӯҳна ҳељ фоида надорад ва навбатро банд мекунад.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Сохтани муқаррарӣ тақрибан 10 дақиқа мегирад. Бе маҳдудият коргари
    # овезонмонда то шаш соат ҷойро банд мекунад — ҳадди 30 дақиқа ҷои кофӣ
    # медиҳад ва дар айни замон чунин ҳолатро зуд ошкор мекунад.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Имзои SigV4 дастӣ навишта шудааст: хатои хурд дар он ҳамаи
      # боркуниҳоро вайрон мекунад. Ба ҳељ вобастагӣ ниёз надорад.
      - name: Test server signing
        run: node --test server/otp-bot/r2.test.mjs

      - name: Test server quota
        run: node --test server/otp-bot/quota.test.mjs

      - name: Test server link preview
        run: node --test server/otp-bot/link_preview.test.mjs

      - name: Test ChatAI web search fallback
        run: node --test server/otp-bot/web_search.test.mjs

      - name: Test server Agora token
        run: |
          cd server/otp-bot
          npm install --no-audit --no-fund --silent
          node --test agora.test.mjs

      # Хэши дастгоҳ дар ду ҷо ҳисоб мешавад — дар барнома (Dart) ва дар
      # сервер (JS). Агар онҳо аз ҳам дур шаванд, сервер сабти дастгоҳи
      # хатоеро нест мекунад. Ҳар ду санҷиш ҳамон қиматҳои маълумро талаб
      # мекунанд, бинобар ин дурӣ дарҳол дида мешавад.
      # Мантиқи ҳуқуқи Plus: мӯҳлат, синни озмоишӣ ва грант. Хатои ин ҷо
      # маънои обунаи пулакии муфт ё моҳи муфти дубора гирифташударо дорад.
      - name: Test Plus entitlement
        run: |
          cd server/otp-bot
          node --test plus.test.mjs

      - name: Test device fingerprint
        run: |
          cd server/otp-bot
          node --test device_fingerprint.test.mjs

      # Эмулятори Firestore JDK 21 талаб мекунад; Java-и пешфарзи коргар
      # кӯҳнатар аст ва эмулятор бе ин қадам оғоз намешавад.
      - name: Setup Java for the emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Санҷиши дастрасӣ ба канали занг дар эмулятори ВОҚЕИИ Firestore.
      # Маҳз ин мантиқ вақте мешиканад, ки занг бо «хатои token» меафтад.
      - name: Test call access (Firestore emulator)
        run: |
          npm install -g firebase-tools --silent
          cd server/otp-bot
          firebase emulators:exec \
            --only firestore \
            --project demo-chatapp \
            --config ../../firebase.emulator.json \
            "node --test agora_access.test.mjs"

      # Қоидаҳои Firestore дар ҳамон эмулятори воқеӣ санҷида мешаванд.
      # Пештар ин санҷиш танҳо дастӣ иҷро мешуд — яъне қоидаи вайрон то
      # фиристодан ба лоиҳаи воқеӣ пинҳон мемонд. Маҳз ҳамин санҷиш хатои
      # «соҳиб номи худашро аз нав навишта наметавонад»-ро гирифт.
      # Ду қадами ҷудо — то дар лог дида шавад, ки вақт ба кучо рафт:
      # ба насби бастаҳо ё ба худи эмулятор.
      - name: Install Firestore rules test deps
        timeout-minutes: 6
        run: |
          cd test/firestore_rules
          npm ci --no-audit --no-fund

      - name: Test Firestore rules (emulator)
        timeout-minutes: 6
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-chatapp \
            --config firebase.emulator.json \
            "node test/firestore_rules/rules.test.mjs"

      # Build versionCode must increase on every installable update.
      # A stable keystore is required for Android to accept this APK over an
      # older installation. Configure these repository Actions secrets:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Configure stable Android release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Stable release signing secrets are missing. Building with the Gradle debug-key fallback so an APK can still be downloaded. Installing over an existing differently-signed app may require uninstalling the old app first."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 1))"
          PUBSPEC_BUILD_NUMBER="$(awk -F'[+]' '/^version:/ { split($2, a, " "); print a[1] }' pubspec.yaml)"
          if [ "$BUILD_NUMBER" -le "$PUBSPEC_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$((PUBSPEC_BUILD_NUMBER + GITHUB_RUN_NUMBER + 1))"
          fi
          echo "Building ChatApp with Android versionCode=$BUILD_NUMBER"
          flutter build apk --release --build-number "$BUILD_NUMBER"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
