name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Ҳангоми якчанд push пай дар пай танҳо охирин сохта мешавад: сохтани нусхаи
# кӯҳна ҳељ фоида надорад ва навбатро банд мекунад.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Сохтани муқаррарӣ тақрибан 10 дақиқа мегирад. Бе маҳдудият коргари
    # овезонмонда то шаш соат ҷойро банд мекунад — ҳадди 30 дақиқа ҷои кофӣ
    # медиҳад ва дар айни замон чунин ҳолатро зуд ошкор мекунад.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Имзои SigV4 дастӣ навишта шудааст: хатои хурд дар он ҳамаи
      # боркуниҳоро вайрон мекунад. Ба ҳељ вобастагӣ ниёз надорад.
      - name: Test server signing
        run: node --test server/otp-bot/r2.test.mjs

      - name: Test server quota
        run: node --test server/otp-bot/quota.test.mjs

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
